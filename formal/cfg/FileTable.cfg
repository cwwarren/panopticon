\* Table bound over a longer run: one CPU, a complete pass every jiffy, one-jiffy lag, one failed delete; no reuse.
CONSTANTS
    CPUs = {"c1"}
    Keys = {"k1"}
    Nodes = {"n1", "n2", "n3"}
    MaxEntries = 16
    W = 2
    P = 1
    TMax = 5
    E = 3
    MaxDelay = 1
    Reuse = FALSE
    RingDrops = FALSE
    DelFails = 1
    Exempt = {"sat", "lost", "gone", "stale"}
SPECIFICATION Spec
INVARIANTS ExactlyOnce NoLoss AttributionCorrect TableBounded RecordsPerWindow NoSaturated
CHECK_DEADLOCK FALSE
