\* Larger ring, safety only, with the View abstraction: three record sizes,
\* slack at its minimum (Max - 1 cells), more than two laps.
CONSTANTS
    Size = 8
    Slack = 2
    Max = 3
    Lens = {1, 2, 3}
    N = 9
    Overrun = 0
    RelaxHead = FALSE
    RelaxTail = FALSE
SPECIFICATION Spec
VIEW View
INVARIANTS TypeOK NoOverwrite NoPartialRead MemSafe DrainAssert Contiguous Accounting Bounds CopyBeforeRelease StepBound NeverBlocks
CHECK_DEADLOCK FALSE
