\* Unsafe: a writer stores one cell past the max it passed to reserve() (a code invariant the verifier does not check; Slack is large enough that the store stays inside the value).
CONSTANTS
    Size = 4
    Slack = 2
    Max = 2
    Lens = {1, 2}
    N = 8
    Overrun = 1
    RelaxHead = FALSE
    RelaxTail = FALSE
SPECIFICATION Spec
INVARIANTS TypeOK NoOverwrite NoPartialRead MemSafe DrainAssert Contiguous Accounting Bounds CopyBeforeRelease StepBound
CHECK_DEADLOCK FALSE
