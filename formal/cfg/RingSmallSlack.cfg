\* Unsafe: Slack smaller than Max - 1 cells (the verifier would reject such a program).
CONSTANTS
    Size = 4
    Slack = 0
    Max = 2
    Lens = {1, 2}
    N = 8
    Overrun = 0
    RelaxHead = FALSE
    RelaxTail = FALSE
SPECIFICATION Spec
INVARIANTS TypeOK NoOverwrite NoPartialRead MemSafe DrainAssert Contiguous Accounting Bounds CopyBeforeRelease StepBound
CHECK_DEADLOCK FALSE
