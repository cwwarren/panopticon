\* Unsafe: immediate reuse with a one-jiffy lag; an increment that lands in a deleted element is wiped by the next insert's value copy.
CONSTANTS
    CPUs = {"c1", "c2"}
    Keys = {"k1"}
    Nodes = {"n1", "n2"}
    MaxEntries = 16
    W = 2
    P = 2
    TMax = 2
    E = 2
    MaxDelay = 1
    Reuse = TRUE
    RingDrops = FALSE
    DelFails = 0
    Exempt = {"sat", "lost", "gone"}
SPECIFICATION Spec
INVARIANTS ExactlyOnce NoLoss
CHECK_DEADLOCK FALSE
