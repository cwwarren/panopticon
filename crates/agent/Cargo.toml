[package]
name = "agent"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[[bin]]
name = "panopticon"
path = "src/main.rs"

[dependencies]
flate2 = "1.1.10"
libbpf-rs = "0.27.2"
libc = "0.2.191"
serde_json = "1"
sha2 = "0.10"
ureq = { version = "3.5.1", default-features = false, features = ["rustls"] }

[build-dependencies]
libbpf-cargo = "0.27.2"
