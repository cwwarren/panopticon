[package]
name = "collector"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[[bin]]
name = "panopticon-collector"
path = "src/main.rs"

[dependencies]
hmac = "0.12.1"
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
serde_json = "1"
sha2 = "0.10"
ureq = { version = "3.5.1", default-features = false, features = ["rustls"] }
webpki = { package = "rustls-webpki", version = "0.103.16", default-features = false, features = ["std"] }
